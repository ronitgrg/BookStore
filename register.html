<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="validation.js"></script>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <h2>Registration Page</h2>
            <form name="regForm" action="#" method="post" onsubmit="return validateForm()">
                <label for="fullname">Full Name:</label>
                <input type="text" name="fullname" id="fullname" placeholder="Full Name"><br>

                <label for="email">Email ID:</label>
                <input type="text" name="email" id="email" placeholder="Email"><br>

                <label for="phone">Mobile No:</label>
                <input type="text" name="phone" id="phone" placeholder="Mobile No."><br>

                <label for="password">Password:</label>
                <input type="password" name="password" id="password" placeholder="Password"><br>

                <label>Gender:</label><br>
                <input type="radio" name="sex" value="male" checked> Male
                <input type="radio" name="sex" value="female"> Female
                <input type="radio" name="sex" value="other"> Other
                <br><br>

                <label>Date of Birth:</label><br>
                <select name="day">
                    <option value="">Day</option>
                    <option>01</option><option>05</option><option>15</option><option>25</option>
                </select>
                <select name="month">
                    <option value="">Month</option>
                    <option>January</option><option>February</option><option>March</option>
                </select>
                <select name="year">
                    <option value="">Year</option>
                    <option>2002</option><option>2003</option><option>2004</option>
                </select>
                <br><br>

                <label>Languages Known:</label><br>
                <input type="checkbox" name="language" value="english"> English
                <input type="checkbox" name="language" value="hindi"> Hindi
                <input type="checkbox" name="language" value="telugu"> Telugu
                <input type="checkbox" name="language" value="tamil"> Tamil<br><br>

                <label>Address:</label><br>
                <textarea name="address" rows="4" cols="40" placeholder="Enter your address here"></textarea><br><br>

                <button type="submit">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
